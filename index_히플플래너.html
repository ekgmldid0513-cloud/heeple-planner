<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="히플 플래너">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>히플 플래너</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="header">
  <div class="header-date" id="headerDate"></div>
  <div class="header-progress">
    <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-text" id="progText">—</div>
  </div>
</div>

<div class="tab-wrap">
  <button class="tab-btn active" data-tab="tw"   onclick="switchTab('tw')">금일 업무</button>
  <button class="tab-btn"        data-tab="ut"   onclick="switchTab('ut')">미처리 업무</button>
  <button class="tab-btn"        data-tab="nw"   onclick="switchTab('nw')">익일 업무</button>
  <button class="tab-btn"        data-tab="hall" onclick="switchTab('hall')">웨딩홀 미정자</button>
</div>

<div class="content">

  <!-- 금일 업무 -->
  <div class="tab-panel active" id="panel-tw">
    <div class="add-row">
      <input class="add-input" id="twInput" placeholder="오늘 처리할 업무..." maxlength="60">
      <button class="add-btn" onclick="addTask('tw')">+</button>
    </div>
    <div class="task-list" id="twList"></div>
    <div class="done-toggle" id="twToggle" onclick="toggleDone('tw')">
      <span class="done-label">완료됨</span>
      <span class="done-badge" id="twDoneCount">0</span>
      <span class="done-chevron" id="twChevron">▼</span>
    </div>
    <div class="task-list" id="twDoneList"></div>
  </div>

  <!-- 미처리 업무 -->
  <div class="tab-panel" id="panel-ut">
    <div class="unhandled-info">⚠️ 자정까지 완료하지 못한 금일 업무가 자동으로 쌓여요.</div>
    <div class="task-list" id="utList"></div>
    <div class="done-toggle" id="utToggle" onclick="toggleDone('ut')">
      <span class="done-label">완료됨</span>
      <span class="done-badge" id="utDoneCount">0</span>
      <span class="done-chevron" id="utChevron">▼</span>
    </div>
    <div class="task-list" id="utDoneList"></div>
  </div>

  <!-- 익일 업무 -->
  <div class="tab-panel" id="panel-nw">
    <div class="add-row">
      <input class="add-input" id="nwInput" placeholder="내일 처리할 업무..." maxlength="60">
      <button class="add-btn" onclick="addTask('nw')">+</button>
    </div>
    <div class="task-list" id="nwList"></div>
    <div class="done-toggle" id="nwToggle" onclick="toggleDone('nw')">
      <span class="done-label">완료됨</span>
      <span class="done-badge" id="nwDoneCount">0</span>
      <span class="done-chevron" id="nwChevron">▼</span>
    </div>
    <div class="task-list" id="nwDoneList"></div>
  </div>

  <!-- 웨딩홀 미정자 -->
  <div class="tab-panel" id="panel-hall">
    <button class="hall-add-btn" onclick="openModal(null)">+ 고객 추가</button>
    <div id="hallList"></div>
  </div>

</div>

<!-- 모달 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="modal-title" id="modalTitle">고객 추가</div>
  <input type="hidden" id="editId">
  <div class="field-label">고객 이름</div>
  <input class="modal-input" id="fName" placeholder="홍길동 커플" maxlength="20">
  <div class="field-label">예식 희망 일정</div>
  <input class="modal-input" id="fDate" placeholder="예) 2026년 5월 중순 주말" maxlength="40">
  <div class="field-label">후보군 / 희망사항</div>
  <textarea class="modal-textarea" id="fNote" placeholder="웨딩홀 후보, 예산, 인원, 기타 요청사항..." rows="4"></textarea>
  <div class="modal-btns">
    <button class="modal-cancel" onclick="closeModal()">취소</button>
    <button class="modal-save" onclick="saveHall()">저장</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="firebase-bundle.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyBjNGVg-WrCCDaz-XCQ8qEWYlCa7W3Vabg",
  authDomain: "heeple-wedding.firebaseapp.com",
  databaseURL: "https://heeple-wedding-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "heeple-wedding",
  storageBucket: "heeple-wedding.firebasestorage.app",
  messagingSenderId: "103176373805",
  appId: "1:103176373805:web:47266a9cdf0d851132daa4"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

var DAYS_KO = ['일','월','화','수','목','금','토'];
var st = { tw:[], ut:[], nw:[], hall:[] };
var doneOpen = { tw:false, ut:false, nw:false };

['tw','ut','nw'].forEach(function(k){
  db.ref('planner/'+k).on('value', function(snap){
    var val = snap.val();
    st[k] = val ? Object.values(val) : [];
    renderTasks(); updateProgress(); updateDots();
  });
});
db.ref('planner/hall').on('value', function(snap){
  var val = snap.val();
  st.hall = val ? Object.values(val) : [];
  st.hall.sort(function(a,b){
    return a.confirmed===b.confirmed ? b.id-a.id : (a.confirmed?1:-1);
  });
  renderHall(); updateDots();
});

function fbSet(k,item){ db.ref('planner/'+k+'/'+item.id).set(item); }
function fbDel(k,id)  { db.ref('planner/'+k+'/'+id).remove(); }
function fbUpd(k,item){ db.ref('planner/'+k+'/'+item.id).update(item); }
function newId(){ return Date.now()+Math.floor(Math.random()*9999); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayKey(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function checkMigration(){
  var tk=todayKey();
  db.ref('planner/meta/lastMigrationDate').once('value').then(function(snap){
    var last=snap.val();
    if(last===tk) return;
    st.tw.filter(function(i){return !i.done;}).forEach(function(item){
      fbSet('ut',Object.assign({},item,{id:newId(),migratedDate:last||'이전날',done:false}));
      fbDel('tw',item.id);
    });
    st.tw.filter(function(i){return i.done;}).forEach(function(item){ fbDel('tw',item.id); });
    st.nw.forEach(function(item){ fbSet('tw',Object.assign({},item,{id:newId()})); fbDel('nw',item.id); });
    db.ref('planner/meta/lastMigrationDate').set(tk);
  });
}

function init(){
  var now=new Date();
  document.getElementById('headerDate').textContent=
    now.getFullYear()+'년 '+(now.getMonth()+1)+'월 '+now.getDate()+'일 '+DAYS_KO[now.getDay()]+'요일';
  document.getElementById('twInput').addEventListener('keydown',function(e){if(e.key==='Enter')addTask('tw');});
  document.getElementById('nwInput').addEventListener('keydown',function(e){if(e.key==='Enter')addTask('nw');});
  setTimeout(checkMigration,2000);
  setInterval(checkMigration,60000);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function(){});
}

function renderTasks(){
  ['tw','ut','nw'].forEach(function(k){
    var pending=st[k].filter(function(i){return !i.done;});
    var done=st[k].filter(function(i){return i.done;});
    var emptyIcon=k==='ut'?'✅':'🌸';
    var emptyMsg=k==='ut'?'미처리 업무가 없어요!':'항목이 없어요';
    document.getElementById(k+'List').innerHTML=pending.length===0
      ?'<div class="empty"><span class="empty-icon">'+emptyIcon+'</span>'+emptyMsg+'</div>'
      :pending.map(function(i){return taskHTML(i,k);}).join('');
    document.getElementById(k+'DoneCount').textContent=done.length;
    document.getElementById(k+'Toggle').classList.toggle('visible',done.length>0);
    var doneEl=document.getElementById(k+'DoneList');
    doneEl.style.cssText=doneOpen[k]?'display:flex;flex-direction:column;gap:6px':'display:none';
    doneEl.innerHTML=done.map(function(i){return taskHTML(i,k);}).join('');
  });
}

function taskHTML(item,k){
  var isUt=k==='ut';
  var cls=item.done?' done':(isUt?' unhandled':'');
  var dateBadge=isUt&&item.migratedDate?'<span class="task-date-badge">'+item.migratedDate+'</span>':'';
  return '<div class="task-item'+cls+'">'
    +'<button class="check-btn" onclick="_toggleTask(\''+k+'\','+item.id+')">'+(item.done?'✓':'')+'</button>'
    +dateBadge
    +'<span class="task-text">'+esc(item.text)+'</span>'
    +'<button class="del-btn" onclick="_delTask(\''+k+'\','+item.id+')">✕</button>'
    +'</div>';
}

function renderHall(){
  var el=document.getElementById('hallList');
  if(st.hall.length===0){
    el.innerHTML='<div class="empty" style="margin-top:20px"><span class="empty-icon">💒</span>등록된 고객이 없어요</div>';
    return;
  }
  el.innerHTML=st.hall.map(function(c){
    return '<div class="hall-card'+(c.confirmed?' confirmed':'')+'">'
      +'<div class="hall-card-top">'
      +'<div class="hall-name">'+(c.confirmed?'<span class="confirmed-badge">확정</span>':'')+esc(c.name)+'</div>'
      +'<div class="hall-card-actions">'
      +'<button class="hall-edit-btn" onclick="openModal(\''+c.id+'\')">수정</button>'
      +'<button class="hall-del-btn" onclick="delHall('+c.id+')">✕</button>'
      +'</div></div>'
      +(c.date?'<div class="hall-field"><span class="hall-field-label">희망일정</span><span class="hall-field-val">'+esc(c.date)+'</span></div>':'')
      +(c.note?'<div class="hall-field"><span class="hall-field-label">후보/요청</span><span class="hall-field-val hall-note">'+esc(c.note)+'</span></div>':'')
      +'<div class="hall-confirm-row">'
      +'<label class="confirm-label">'
      +'<input type="checkbox" onchange="toggleConfirm('+c.id+',this.checked)"'+(c.confirmed?' checked':'')+'>'
      +'<span>웨딩홀 확정</span>'
      +'</label>'
      +'</div>'
      +'</div>';
  }).join('');
}

function openModal(id){
  document.getElementById('modalOverlay').classList.add('active');
  document.getElementById('modal').classList.add('active');
  if(id){
    var c=st.hall.find(function(h){return h.id==id;});
    document.getElementById('modalTitle').textContent='고객 수정';
    document.getElementById('editId').value=c.id;
    document.getElementById('fName').value=c.name||'';
    document.getElementById('fDate').value=c.date||'';
    document.getElementById('fNote').value=c.note||'';
  } else {
    document.getElementById('modalTitle').textContent='고객 추가';
    document.getElementById('editId').value='';
    document.getElementById('fName').value='';
    document.getElementById('fDate').value='';
    document.getElementById('fNote').value='';
  }
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.getElementById('modal').classList.remove('active');
}
function saveHall(){
  var name=document.getElementById('fName').value.trim();
  if(!name){showToast('고객 이름을 입력해주세요');return;}
  var editId=document.getElementById('editId').value;
  var id=editId?Number(editId):newId();
  var existing=editId?st.hall.find(function(h){return h.id==editId;}):null;
  fbSet('hall',{id:id,name:name,
    date:document.getElementById('fDate').value.trim(),
    note:document.getElementById('fNote').value.trim(),
    confirmed:existing?existing.confirmed:false
  });
  closeModal();
  showToast(editId?'수정됐어요 ✓':'추가됐어요 ✓');
}
function delHall(id){
  if(!confirm('삭제할까요?'))return;
  fbDel('hall',id); showToast('삭제됐어요');
}
function toggleConfirm(id,checked){
  var c=st.hall.find(function(h){return h.id==id;});
  if(c) fbUpd('hall',Object.assign({},c,{confirmed:checked}));
}

function addTask(k){
  var input=document.getElementById(k+'Input');
  var text=input.value.trim(); if(!text)return;
  fbSet(k,{id:newId(),text:text,done:false});
  input.value=''; showToast('추가됐어요 ✓');
}
function _toggleTask(k,id){
  var item=st[k].find(function(i){return i.id===id;});
  if(item) fbUpd(k,Object.assign({},item,{done:!item.done}));
}
function _delTask(k,id){ fbDel(k,id); showToast('삭제됐어요'); }

function toggleDone(k){
  doneOpen[k]=!doneOpen[k]; renderTasks();
  document.getElementById(k+'Chevron').className='done-chevron'+(doneOpen[k]?' open':'');
}
function switchTab(tab){
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('panel-'+tab).classList.add('active');
  document.querySelector('[data-tab="'+tab+'"]').classList.add('active');
}
function updateProgress(){
  var total=st.tw.length,done=st.tw.filter(function(i){return i.done;}).length;
  var pct=total===0?0:Math.round(done/total*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progText').textContent=total===0?'오늘 할 일을 추가해보세요':'오늘 '+done+' / '+total+' 완료';
}
function updateDots(){
  var cnt={
    tw:st.tw.filter(function(i){return !i.done;}).length,
    ut:st.ut.filter(function(i){return !i.done;}).length,
    nw:st.nw.filter(function(i){return !i.done;}).length,
    hall:st.hall.filter(function(h){return !h.confirmed;}).length
  };
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    var k=btn.dataset.tab;
    var old=btn.querySelector('.tab-dot'); if(old)old.remove();
    if(cnt[k]>0){var dot=document.createElement('span');dot.className='tab-dot';btn.appendChild(dot);}
  });
}
function esc(t){return t?t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''; }
var toastT;
function showToast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('show');},2000);
}
init();
</script>

<style>
:root{--pink:#d4737a;--pink-light:#f2d9db;--pink-pale:#fdf7f7;--orange:#e07c50;--orange-light:#fae5d8;--orange-pale:#fdf6f2;--rose:#c45f72;--beige:#f7f4f0;--border:#ece8e4;--text:#2c2421;--text-mid:#7a6e6b;--text-light:#b0a8a5;--white:#ffffff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--beige);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:18px 20px 14px}
.header-date{font-size:12px;color:var(--text-light);font-weight:300}
.header-progress{margin-top:10px;display:flex;align-items:center;gap:10px}
.prog-bar{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--pink);border-radius:99px;transition:width 0.4s}
.prog-text{font-size:11px;color:var(--text-light);white-space:nowrap}
.tab-wrap{background:var(--white);border-bottom:1px solid var(--border);display:flex;position:sticky;top:0;z-index:100}
.tab-btn{flex:1;padding:13px 4px;border:none;background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:11px;font-weight:400;color:var(--text-light);cursor:pointer;position:relative;transition:color 0.2s;line-height:1.3}
.tab-btn.active{color:var(--pink);font-weight:700}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:6px;right:6px;height:2px;background:var(--pink);border-radius:2px 2px 0 0}
.tab-btn[data-tab="ut"].active{color:var(--orange)}
.tab-btn[data-tab="ut"].active::after{background:var(--orange)}
.tab-btn[data-tab="hall"].active{color:var(--rose)}
.tab-btn[data-tab="hall"].active::after{background:var(--rose)}
.tab-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--pink);vertical-align:middle;margin-left:2px;margin-bottom:1px}
.tab-btn[data-tab="ut"] .tab-dot{background:var(--orange)}
.tab-btn[data-tab="hall"] .tab-dot{background:var(--rose)}
.content{padding:16px 16px 100px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.add-row{display:flex;gap:8px;margin-bottom:12px}
.add-input{flex:1;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;background:var(--white);color:var(--text);outline:none;transition:border-color 0.2s}
.add-input:focus{border-color:var(--pink)}
.add-input::placeholder{color:var(--text-light)}
.add-btn{width:42px;height:42px;background:var(--pink);color:white;border:none;border-radius:10px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-btn:active{opacity:0.75}
.task-list{display:flex;flex-direction:column;gap:6px}
.task-item{display:flex;align-items:center;gap:10px;background:var(--white);border-radius:10px;padding:12px 13px;border:1px solid var(--border);animation:fadeIn 0.2s}
.task-item.done{background:var(--pink-pale);border-color:var(--pink-light);opacity:0.6}
.task-item.unhandled{background:var(--orange-pale);border-color:var(--orange-light)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.check-btn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all 0.15s}
.task-item.done .check-btn{background:var(--pink);border-color:var(--pink);color:white}
.task-item.unhandled .check-btn{border-color:var(--orange)}
.task-text{flex:1;font-size:14px;line-height:1.4}
.task-item.done .task-text{text-decoration:line-through;color:var(--text-light)}
.task-date-badge{font-size:10px;color:var(--orange);font-weight:600;background:var(--orange-light);padding:2px 7px;border-radius:99px;flex-shrink:0}
.del-btn{background:none;border:none;color:var(--border);font-size:14px;cursor:pointer;padding:2px;flex-shrink:0}
.del-btn:active{color:var(--pink)}
.done-toggle{display:none;align-items:center;gap:8px;margin:16px 0 8px;cursor:pointer}
.done-toggle.visible{display:flex}
.done-label{font-size:11px;color:var(--text-light)}
.done-badge{font-size:10px;background:var(--border);color:var(--text-mid);border-radius:99px;padding:1px 7px}
.done-chevron{margin-left:auto;font-size:10px;color:var(--text-light);transition:transform 0.2s}
.done-chevron.open{transform:rotate(180deg)}
.empty{text-align:center;padding:24px 0;color:var(--text-light);font-size:13px}
.empty-icon{font-size:24px;display:block;margin-bottom:6px}
.unhandled-info{background:var(--orange-pale);border:1px solid var(--orange-light);border-radius:10px;padding:11px 13px;margin-bottom:12px;font-size:12px;color:var(--orange);line-height:1.6}
.hall-add-btn{display:block;width:100%;padding:12px;background:var(--rose);color:white;border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:14px}
.hall-add-btn:active{opacity:0.8}
.hall-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;animation:fadeIn 0.2s}
.hall-card.confirmed{background:#f8fdf8;border-color:#b8ddb8;opacity:0.75}
.hall-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hall-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.confirmed-badge{font-size:10px;background:#4caf7d;color:white;border-radius:99px;padding:2px 8px;font-weight:600}
.hall-card-actions{display:flex;gap:6px}
.hall-edit-btn{padding:5px 12px;background:var(--beige);border:1px solid var(--border);border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text-mid);cursor:pointer}
.hall-del-btn{width:28px;height:28px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-light);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hall-del-btn:active{color:var(--pink);border-color:var(--pink)}
.hall-field{display:flex;gap:8px;margin-bottom:6px;align-items:flex-start}
.hall-field-label{font-size:11px;color:var(--text-light);background:var(--beige);padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.hall-field-val{font-size:13px;color:var(--text);line-height:1.5}
.hall-note{white-space:pre-wrap}
.hall-confirm-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.confirm-label{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;color:var(--text-mid)}
.confirm-label input[type=checkbox]{width:16px;height:16px;accent-color:#4caf7d;cursor:pointer}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200}
.modal-overlay.active{display:block}
.modal{display:none;position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;background:var(--white);border-radius:20px 20px 0 0;padding:24px 20px 40px;z-index:201;animation:slideUp 0.25s ease}
.modal.active{display:block}
@keyframes slideUp{from{transform:translateX(-50%) translateY(40px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.modal-title{font-size:16px;font-weight:700;margin-bottom:18px}
.field-label{font-size:11px;color:var(--text-light);margin-bottom:5px;margin-top:14px}
.modal-input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color 0.2s}
.modal-input:focus{border-color:var(--rose)}
.modal-textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);outline:none;resize:none;line-height:1.6;transition:border-color 0.2s}
.modal-textarea:focus{border-color:var(--rose)}
.modal-btns{display:flex;gap:8px;margin-top:18px}
.modal-cancel{flex:1;padding:12px;background:var(--beige);border:1px solid var(--border);border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text-mid);cursor:pointer}
.modal-save{flex:2;padding:12px;background:var(--rose);color:white;border:none;border-radius:10px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:600;cursor:pointer}
.modal-save:active{opacity:0.8}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(44,36,33,0.88);color:white;padding:9px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;z-index:999;transition:all 0.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</body>
</html>
